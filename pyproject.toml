[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-runtime"
version = "0.1.0"
description = "PIXEL — Personal AI Voice & Agent Operating Layer"
readme = "README.md"
authors = [
    { name = "PIXEL Core Team" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]
voice = [
    "onnxruntime>=1.17.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -m 'not voice_hw'"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "voice_hw: marks tests requiring local voice model weights or hardware (deselect with -m 'not voice_hw')",
]
